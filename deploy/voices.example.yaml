# Cloudflare R2 fetch configuration example

r2:
  # Optional path prefix inside the bucket (e.g., "gpt-sovits/voices").
  prefix: ""

# Define characters, languages, and samples.
# Supported API languages: en, ja, ko, zh
# Aliases you can use here (will be normalized): jp->ja, kr->ko, cn->zh

characters:
  rally:
    en:
      - name: default
        key: rally-en-default.wav
    jp:
      - name: happy
        key: alchemist-jp-happy.wav

